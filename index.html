<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두들김 현장 타격음 수집시스템</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        
        .control-group { margin-bottom: 20px; display: none; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .active-group { display: flex; }
        
        /* 입력 폼 스타일 */
        .info-box { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; width: 100%; max-width: 450px; box-sizing: border-box; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; font-weight: bold; }
        .input-field { padding: 8px; font-size: 15px; border: 1px solid #bdc3c7; border-radius: 6px; width: 60%; box-sizing: border-box;}
        
        .divider { height: 1px; background-color: #ecf0f1; margin: 20px 0; }
        .help-text { font-size: 13px; color: #e74c3c; margin-bottom: 15px; font-weight: bold; }
        
        button { padding: 15px 25px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.1s, opacity 0.3s; }
        button:active { transform: scale(0.95); }
        
        /* 버튼 색상 */
        .time-btn { background-color: #34495e; color: white; flex: 1; max-width: 100px; padding: 12px 15px; font-size: 16px; }
        #startBtn { background-color: #3498db; color: white; width: 100%; max-width: 350px;}
        #judgeGoodBtn { background-color: #2ecc71; color: white; flex: 1; max-width: 180px; }
        #judgeBadBtn { background-color: #e74c3c; color: white; flex: 1; max-width: 180px; }
        #nextTestBtn { background-color: #f39c12; color: white; flex: 1; max-width: 180px; }
        #endTestBtn { background-color: #8e44ad; color: white; flex: 1; max-width: 180px; }
        
        #graphContainer { background-color: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #analyserCanvas { width: 100%; height: 250px; background-color: #1e272e; border-radius: 8px; }
        
        #status { margin-top: 15px; font-size: 16px; font-weight: bold; padding: 10px; border-radius: 8px; background-color: #e8f6f3; color: #16a085;}
        #testCounter { font-size: 16px; color: #555; margin-bottom: 15px; font-weight: bold; display: none;}
    </style>
</head>
<body>
    <h1>현장 타격음 수집시스템</h1>
    <p class="subtitle">현장 정보와 여러 타격음 데이터를 하나의 CSV로 구조화합니다.</p>
    
    <div id="testCounter">현재 대기 중: 1번째 조사</div>

    <!-- 0단계: 최초 1회 정보 입력 -->
    <div id="step0" class="control-group active-group" style="flex-direction: column; align-items: center;">
        <div class="info-box">
            
            <div class="input-row">
                <label for="dateInput">조사 일자</label>
                <input type="date" id="dateInput" class="input-field">
            </div>
            <div class="input-row">
                <label for="bridgeInput">대상 교량</label>
                <input type="text" id="bridgeInput" class="input-field" placeholder="예: 수내교 판교장향">
            </div>
            <div class="input-row">
                <label for="locationInput">조사 위치</label>
                <input type="text" id="locationInput" class="input-field" placeholder="예: S1">
            </div>
            <div class="input-row">
                <label for="descInput">조사 내용</label>
                <input type="text" id="descInput" class="input-field" placeholder="예: 코핑부 하부 타격">
            </div>

            <div class="divider"></div>
            <div class="help-text">※ 부재 및 열화 정보를 모를 경우 0을 유지하세요.</div>
            
            <div class="input-row">
                <label for="thicknessInput">부재 두께 (cm)</label>
                <input type="number" id="thicknessInput" class="input-field" value="0" step="0.1">
            </div>
            <div class="input-row">
                <label for="defectInput">예상 열화 깊이 (cm)</label>
                <input type="number" id="defectInput" class="input-field" value="0" step="0.1">
            </div>
            
            <div style="margin-top: 20px; margin-bottom: 10px; font-size: 14px; color: #555;">수집 시간을 선택하면 조사가 시작됩니다.</div>
            
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="time-btn" onclick="setInitialData(3)">3초</button>
                <button class="time-btn" onclick="setInitialData(4)">4초</button>
                <button class="time-btn" onclick="setInitialData(5)">5초</button>
            </div>
        </div>
    </div>

    <!-- 1단계: 수집 시작 -->
    <div id="step1" class="control-group">
        <button id="startBtn">1번째 조사 시작</button>
    </div>

    <!-- 2단계: 상태 판별 -->
    <div id="step2" class="control-group">
        <button id="judgeGoodBtn">✅ 건전부</button>
        <button id="judgeBadBtn">❌ 열화부</button>
    </div>

    <!-- 3단계: 다음 행동 선택 -->
    <div id="step3" class="control-group">
        <button id="nextTestBtn">🔄 다음 조사</button>
        <button id="endTestBtn">💾 조사 종료 (CSV 다운)</button>
    </div>

    <div id="graphContainer">
        <canvas id="analyserCanvas"></canvas>
    </div>

    <div id="status">현장 정보를 입력하고 수집 시간을 선택해 주세요.</div>

    <script>
        // 오늘 날짜 기본 세팅 (YYYY-MM-DD)
        document.getElementById('dateInput').value = new Date().toLocaleDateString('en-CA');

        // UI 요소
        const step0 = document.getElementById('step0');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const startBtn = document.getElementById('startBtn');
        const judgeGoodBtn = document.getElementById('judgeGoodBtn');
        const judgeBadBtn = document.getElementById('judgeBadBtn');
        const nextTestBtn = document.getElementById('nextTestBtn');
        const endTestBtn = document.getElementById('endTestBtn');
        const status = document.getElementById('status');
        const testCounter = document.getElementById('testCounter');
        const canvas = document.getElementById('analyserCanvas');
        const canvasCtx = canvas.getContext('2d');

        // 오디오 및 메타데이터 변수
        let audioContext, stream, microphone, processor, analyser;
        let animationId;
        
        let metaData = {}; 
        let durationSeconds = 0; 
        let sampleRate = 0;
        let targetSamples = 0;
        
        let allTestsData = []; 
        let judgments = [];    
        let currentTestData = [];
        
        let isRecording = false;
        let testCount = 1;

        function showStep(stepId) {
            step0.classList.remove('active-group');
            step1.classList.remove('active-group');
            step2.classList.remove('active-group');
            step3.classList.remove('active-group');
            if(stepId !== 'none') document.getElementById(stepId).classList.add('active-group');
        }

        function escapeCSV(str) {
            if (str === null || str === undefined) return '""';
            return '"' + String(str).replace(/"/g, '""') + '"';
        }

        // 0단계: 메타정보 저장 및 시간 설정
        function setInitialData(seconds) {
            metaData = {
                date: document.getElementById('dateInput').value,
                bridge: document.getElementById('bridgeInput').value || "-",
                location: document.getElementById('locationInput').value || "-",
                description: document.getElementById('descInput').value || "-",
                thickness: document.getElementById('thicknessInput').value || "0",
                defect: document.getElementById('defectInput').value || "0",
                time: seconds
            };
            
            durationSeconds = seconds;
            
            status.innerText = `[${metaData.bridge} / ${metaData.location}] 설정 완료. 마이크를 허용해 주세요.`;
            testCounter.style.display = 'block';
            startBtn.innerText = `1번째 조사 시작 (${durationSeconds}초)`;
            showStep('step1');
        }

        async function initAudio() {
            if (audioContext) return; 
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioContext.sampleRate;
                targetSamples = sampleRate * durationSeconds; 
                
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                const bufferSize = 4096;
                processor = audioContext.createScriptProcessor(bufferSize, 1, 1);
                
                microphone.connect(analyser);
                microphone.connect(processor);
                processor.connect(audioContext.destination);
                
                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    for (let i = 0; i < inputData.length; i++) {
                        if (currentTestData.length < targetSamples) {
                            currentTestData.push(inputData[i]); 
                        }
                    }
                    if (currentTestData.length >= targetSamples) {
                        isRecording = false;
                        setTimeout(onRecordingComplete, 0); 
                    }
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                drawOscilloscope(); 
            } catch (err) {
                status.innerText = "마이크 권한 거부 또는 오류 발생";
                status.style.backgroundColor = "#fadbd8";
                status.style.color = "#c0392b";
            }
        }

        startBtn.addEventListener('click', async () => {
            await initAudio(); 
            if (audioContext.state === 'suspended') await audioContext.resume();
            
            currentTestData = [];
            isRecording = true; 
            status.innerText = `🔴 수집 중... 타격하세요 (${durationSeconds}초)`;
            status.style.backgroundColor = "#fadbd8";
            status.style.color = "#c0392b";
            showStep('none');
        });

        function onRecordingComplete() {
            allTestsData.push(currentTestData);
            status.innerText = `✅ ${durationSeconds}초 수집 완료. 타격부 상태를 판별해 주세요.`;
            status.style.backgroundColor = "#d4efdf";
            status.style.color = "#27ae60";
            showStep('step2');
        }

        // 판별 버튼 클릭 시 '건전부', '열화부' 텍스트로 저장되도록 수정
        judgeGoodBtn.addEventListener('click', () => saveJudgment("건전부"));
        judgeBadBtn.addEventListener('click', () => saveJudgment("열화부"));

        function saveJudgment(result) {
            judgments.push(result); 
            status.innerText = `현재까지 총 ${testCount}회 조사됨. 다음 행동을 선택하세요.`;
            status.style.backgroundColor = "#fcf3cf";
            status.style.color = "#d68910";
            showStep('step3');
        }

        nextTestBtn.addEventListener('click', () => {
            testCount++;
            testCounter.innerText = `현재 대기 중: ${testCount}번째 조사`;
            startBtn.innerText = `${testCount}번째 조사 시작 (${durationSeconds}초)`;
            status.innerText = "조사 시작 버튼을 누르고 타격하세요.";
            status.style.backgroundColor = "#e8f6f3";
            status.style.color = "#16a085";
            
            canvasCtx.fillStyle = '#1e272e';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            showStep('step1'); 
        });

        endTestBtn.addEventListener('click', () => {
            status.innerText = "데이터를 CSV로 변환 중입니다...";
            generateAndDownloadCSV();
        });

        function generateAndDownloadCSV() {
            if (allTestsData.length === 0) return;

            // 1. CSV 상단 구조화: 메타데이터 헤더 (1행) 및 값 (2행)
            const metaHeader = ["일자", "교량", "위치", "내용", "부재 두께(cm)", "예상 열화 깊이(cm)", "수집시간(초)"].join(",");
            const metaValues = [
                escapeCSV(metaData.date), 
                escapeCSV(metaData.bridge), 
                escapeCSV(metaData.location), 
                escapeCSV(metaData.description), 
                metaData.thickness, 
                metaData.defect, 
                metaData.time
            ].join(",");

            // 2. 데이터 영역 헤더 (3행) - 여기에 '건전부', '열화부'가 들어갑니다.
            const dataHeader = ["time", ...judgments].join(",");
            
            // 행(Row) 조립
            const rows = [metaHeader, metaValues, dataHeader];
            
            const timeStep = 1.0 / sampleRate;

            // 3. 음향 파형 데이터 (4행부터~)
            for (let i = 0; i < targetSamples; i++) {
                const exactTime = (i * timeStep).toFixed(6); 
                const rowData = [exactTime];
                for (let testIdx = 0; testIdx < allTestsData.length; testIdx++) {
                    rowData.push(allTestsData[testIdx][i].toFixed(5));
                }
                rows.push(rowData.join(","));
            }

            const csvContent = rows.join("\n");
            // 엑셀에서 한글 깨짐 방지를 위해 BOM(\uFEFF) 추가
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `NDT_${metaData.bridge}_${metaData.location}_${Date.now()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            status.innerText = `총 ${testCount}회의 조사가 하나의 파일로 저장되었습니다.`;
            showStep('none'); 
        }

        function drawOscilloscope() {
            animationId = requestAnimationFrame(drawOscilloscope);
            if (!isRecording) return; 
            
            const dataArray = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#1e272e';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = '#485460';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2);
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#0fb9b1';
            canvasCtx.beginPath();
            
            const sliceWidth = canvas.width * 1.0 / analyser.fftSize;
            let x = 0;
            for (let i = 0; i < analyser.fftSize; i++) {
                const v = dataArray[i];
                const y = (canvas.height / 2) - (v * canvas.height / 2);
                if (i === 0) canvasCtx.moveTo(x, y); 
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.stroke();
        }

        function resizeCanvas() {
            const container = document.getElementById('graphContainer');
            canvas.width = container.offsetWidth - 20;
            canvas.height = 250;
        }
    </script>
</body>
</html>
